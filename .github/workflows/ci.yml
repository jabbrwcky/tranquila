name: CI

on:
  pull_request:
  push:
    branches: [main]
  # A branch with no open PR gets no image otherwise. Dispatching runs against
  # the base repo with a full token and OIDC, so push and signing work as usual.
  workflow_dispatch:

# A PR gets a fresh run per push and the superseded one is pointless; main
# pushes are not cancelled because each commit must produce its own image.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  checks:
    uses: ./.github/workflows/go-checks.yml
    permissions:
      contents: read

  # needs: checks keeps the guarantee the old workflow_run arrangement gave —
  # no image ever exists for a commit whose tests failed.
  image:
    name: Image
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pull requests from forks get no registry credentials and no OIDC token,
      # so they build only and are not signed.
      - name: Decide whether the image can be pushed
        id: push
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] \
            || [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # On pull_request the checked-out HEAD is the merge commit, which exists
      # in no one's clone, so the tag comes from the head commit instead.
      - name: Resolve the commit being built
        id: commit
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "short_sha=${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        if: steps.push.outputs.enabled == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        with:
          images: ${{ env.IMAGE }}
          # :latest belongs to releases only, see docs/adr/0001-ci-cd-pipeline.md.
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.commit.outputs.short_sha }}
            type=ref,event=branch
            type=ref,event=pr

      # provenance: false is deliberate — build-push-action would otherwise
      # attach mode=min provenance, an extra manifest GHCR renders as an
      # unknown/unknown row, asserting only what the cosign signature already
      # proves cryptographically. Releases do carry full provenance.
      - name: Build the image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.push.outputs.enabled == 'true' }}
          build-args: |
            VERSION=${{ steps.commit.outputs.short_sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.push.outputs.enabled == 'true'

      # Keyless: the signing identity is this workflow's OIDC token, so there
      # is no private key to hold. Signing by digest covers every tag at once.
      # Skipped for fork builds, which export nothing and so have no digest.
      - name: Sign the image
        if: steps.push.outputs.enabled == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
