name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '>=1.22.0'
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      # The e2e module is not covered by the commands above (go does not descend
      # into nested modules), so vet it here to catch compile breakage even when
      # the container-backed job is skipped.
      - name: Vet e2e module
        working-directory: e2e
        run: go vet ./...

  e2e:
    name: End-to-End (MinIO + Toxiproxy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '>=1.22.0'
          check-latest: true

      # Docker is preinstalled on ubuntu-latest and testcontainers finds
      # /var/run/docker.sock unaided, so no runtime setup is needed here. The
      # podman handling in e2e/runtime_test.go is inert on this runner.
      - name: Run end-to-end tests
        working-directory: e2e
        run: go test -v -timeout 30m ./...

  vuln-check:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '>=1.22.0'
          check-latest: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
