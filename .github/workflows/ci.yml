name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  # A push to a branch with an open PR would otherwise run this workflow twice
  # (once for the push, once for the pull_request synchronize) against the
  # same commit. On push, skip the real jobs when an open PR already covers
  # the branch — the pull_request-triggered run covers it instead.
  should-run-push:
    name: Check for open PR (push dedup)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Skip if an open PR already covers this branch
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh pr list --repo "${{ github.repository }}" --head "${{ github.ref_name }}" --state open --json number --jq 'length')
          if [ "$count" -gt 0 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping push-triggered run — PR already covers ${{ github.ref_name }}"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-test:
    name: Build & Test
    needs: [should-run-push]
    if: always() && (github.event_name != 'push' || needs.should-run-push.outputs.run == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '>=1.25.0'
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      # The e2e module is not covered by the commands above (go does not descend
      # into nested modules), so vet it here to catch compile breakage even when
      # the container-backed job is skipped.
      - name: Vet e2e module
        working-directory: e2e
        run: go vet ./...

  e2e:
    name: End-to-End (MinIO + Toxiproxy)
    needs: [should-run-push]
    if: always() && (github.event_name != 'push' || needs.should-run-push.outputs.run == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '>=1.25.0'
          check-latest: true

      # Docker is preinstalled on ubuntu-latest and testcontainers finds
      # /var/run/docker.sock unaided, so no runtime setup is needed here. The
      # podman handling in e2e/runtime_test.go is inert on this runner.
      - name: Run end-to-end tests
        working-directory: e2e
        run: go test -v -timeout 30m ./...

  vuln-check:
    name: Vulnerability Check
    needs: [should-run-push]
    if: always() && (github.event_name != 'push' || needs.should-run-push.outputs.run == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '>=1.25.0'
          check-latest: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
