name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Cheap and first, so a misplaced tag fails in seconds rather than after the
  # end-to-end suite and a two-platform build have already run.
  guard:
    name: Tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # A release is cut from main. A tag on a side branch would publish code
      # that never went through a PR, so it fails here rather than after the
      # artifacts are already in the registry.
      - name: Refuse a tag that is not reachable from main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} (${GITHUB_SHA}) is not reachable from main — cut releases from main"
            exit 1
          fi
          echo "${GITHUB_REF_NAME} is reachable from main"

  # The release rebuilds its artifacts, so the tagged commit is gated here
  # rather than relying on the CI run of whatever was pushed to main.
  verify:
    needs: guard
    uses: ./.github/workflows/go-checks.yml
    with:
      run-e2e: true
    permissions:
      contents: read

  image:
    name: Image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Re-releasing an older tag or cutting a pre-release must not move
      # :latest, so it only follows the highest stable tag in the repository.
      # Deliberately not "is this the tip of main": Renovate automerges here
      # with ignoreTests, so main can move between the tag push and this run,
      # which would silently drop :latest with no error.
      - name: Decide whether this release owns :latest
        id: latest
        run: |
          case "$GITHUB_REF_NAME" in
            *-*)
              echo "$GITHUB_REF_NAME is a pre-release, leaving :latest alone"
              echo "owns=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          newest=$(git tag --list 'v*' --sort=-v:refname | grep -v -- '-' | head -n 1)
          if [ "$newest" = "$GITHUB_REF_NAME" ]; then
            echo "$GITHUB_REF_NAME is the newest stable tag, it owns :latest"
            echo "owns=true" >> "$GITHUB_OUTPUT"
          else
            echo "$newest is newer than $GITHUB_REF_NAME, leaving :latest alone"
            echo "owns=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect release metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=${{ steps.latest.outputs.owns }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # One build feeds every release tag, so they all resolve to this digest.
      # SBOM and provenance ride along as attestations on the same index.
      # cache-from only: a release must not evict CI's cache entries.
      - name: Build and push the release image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha

      # -X silently no-ops on a wrong symbol path, so an image reporting "dev"
      # would otherwise ship unnoticed.
      - name: Check the version was linked in
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          got=$(docker run --rm "${IMAGE}@${DIGEST}" --version)
          case "$got" in
            *"${GITHUB_REF_NAME}"*) echo "version reports ${got}" ;;
            *) echo "::error::image reports '${got}', expected ${GITHUB_REF_NAME}"; exit 1 ;;
          esac

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless: the signing identity is this workflow's OIDC token, so there
      # is no private key to hold. Signing by digest covers every tag at once.
      - name: Sign the image
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Verify the signature and the attestations
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}" > /dev/null
          # buildx attaches SBOM and provenance as in-toto attestations on the
          # index, so they are asserted here rather than through cosign.
          for kind in SBOM Provenance; do
            if ! docker buildx imagetools inspect "${IMAGE}@${DIGEST}" \
              --format "{{ json .${kind} }}" | grep -q .; then
              echo "::error::the image carries no ${kind} attestation"
              exit 1
            fi
            echo "${kind} attestation present"
          done
          {
            echo "### Image"
            echo
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "Tags: ${{ steps.meta.outputs.tags }}" | tr '\n' ' '
          } >> "$GITHUB_STEP_SUMMARY"

  # needs: image, not just verify — the GitHub release is the thing people see,
  # so it is not created until the image it documents is published and verified.
  binaries:
    name: Binaries
    needs: [verify, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable

      - name: Build release binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/tranquila-${target%/*}-${target#*/}" .
          done

      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      # syft reads the Go build information the linker embeds in each binary,
      # which -s -w does not strip, so the SBOM lists the exact module versions
      # that went into that artifact.
      - name: Generate an SBOM per binary
        run: |
          for binary in dist/tranquila-*; do
            case "$binary" in *.spdx.json) continue ;; esac
            syft scan "file:${binary}" -o spdx-json > "${binary}.spdx.json"
          done

      # Checksums cover the binaries and their SBOMs, so signing this one file
      # is enough to authenticate every release asset.
      - name: Checksum the assets
        run: (cd dist && sha256sum tranquila-* > checksums.txt)

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # A bundle carries the signature and the certificate in one file, and is
      # what cosign v3 requires of sign-blob. cosign v2 writes it too.
      - name: Sign the checksums
        run: cosign sign-blob --yes --bundle dist/checksums.txt.bundle dist/checksums.txt

      - name: Verify the signature
        run: |
          cosign verify-blob \
            --bundle dist/checksums.txt.bundle \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/checksums.txt

      # A tag carrying a suffix is a pre-release, the same predicate the image
      # job uses to decide :latest. Without this the release pointer and the
      # container tags disagree about what is released.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          files: dist/*
